[package]
name = "tansr-sdk-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Rust examples for Tansr Serve"
readme = "README.md"
license = "MIT"
repository = "https://github.com/tansrai/tansr-rust"
documentation = "https://docs.rs/tansr-sdk-demo/0.1.0/tansr_sdk_demo/"
keywords = ["tansr", "sdk", "demo", "cli", "agent"]
categories = ["command-line-utilities", "api-bindings"]
publish = ["crates-io"]
include = ["src/**", "examples/**", "/LICENSE", "/README.md", "/Cargo.toml", "/Cargo.lock"]

[dependencies]
tansr-sdk = { version = "=0.1.0", path = ".." }
async-trait = "0.1"
futures-util = "0.3"
serde_json = "1"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process"] }

[[bin]]
name = "tansr-chat"
path = "src/bin/chat.rs"

[[bin]]
name = "tansr-tools"
path = "src/bin/tools.rs"

[[bin]]
name = "tansr-archive"
path = "src/bin/archive.rs"

[lints.rust]
unsafe_code = "forbid"
